# generated by scripts/build.mjs from roles/*.md; `relay setup codex <project>` appends the missing tables to <project>/.codex/config.toml with __RELAY_AGENTS_DIR__ resolved to the absolute <project>/.codex/agents
# Codex offers a custom agent as spawn_agent agent_type only when it is registered here (observed, Codex 0.163.0).

[agents.relay-architect]
description = "Use when designing software architecture, comparing technical approaches, writing a Relay plan, or reviewing a design or finished branch."
config_file = "__RELAY_AGENTS_DIR__/relay-architect.toml"

[agents.relay-conductor]
description = "Use when asked to execute a whole Relay plan through lanes, reviews, fixes, and merges."
config_file = "__RELAY_AGENTS_DIR__/relay-conductor.toml"

[agents.relay-implementer-deep]
description = "Use after three failed fix rounds on a lane task, or for tasks marked strong in the plan."
config_file = "__RELAY_AGENTS_DIR__/relay-implementer-deep.toml"

[agents.relay-implementer-fast]
description = "Use for lane tasks with complete planned code or mechanical edits to one file. Escalate when judgment is needed."
config_file = "__RELAY_AGENTS_DIR__/relay-implementer-fast.toml"

[agents.relay-implementer]
description = "Use for related tasks in one lane that need changes across files, integration, or debugging."
config_file = "__RELAY_AGENTS_DIR__/relay-implementer.toml"

[agents.relay-reverse-engineer]
description = "Use when reconstructing an existing system and explaining its mechanisms, constraints, failures, and design rationale."
config_file = "__RELAY_AGENTS_DIR__/relay-reverse-engineer.toml"

[agents.relay-reviewer]
description = "Use after a lane reports DONE, or for a scoped review of fixes against the brief and spec."
config_file = "__RELAY_AGENTS_DIR__/relay-reviewer.toml"

[agents.relay-scout]
description = "Use to locate files, symbols, call sites, configuration, or test commands before planning or implementation."
config_file = "__RELAY_AGENTS_DIR__/relay-scout.toml"

[agents.relay-teacher]
description = "Use when teaching a concept or system from supplied material, independent research, or an optional handoff."
config_file = "__RELAY_AGENTS_DIR__/relay-teacher.toml"

[agents.relay-test-author]
description = "Use to write acceptance tests from the spec for medium or high risk tasks before or independently of implementation."
config_file = "__RELAY_AGENTS_DIR__/relay-test-author.toml"
